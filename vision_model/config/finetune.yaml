data:
  train_dir: vision_model/data/imagenette_100/train
  validation_dir: vision_model/data/imagenette_100/val

model:
  source: google/vit-base-patch16-224-in21k
  name: vision_model/models/vit-base-patch16-224-in21k
  freeze_backbone: false

training:
  batch_size: 32
  epochs: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  num_workers: 4
  device: auto
  seed: 7

checkpoint:
  path: vision_model/checkpoints/vit_base_imagenette_finetune.pt
