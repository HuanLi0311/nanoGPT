data:
  raw_dir: language_model/data/raw
  encoded_dir: language_model/data/encode
  tokenizer_dir: language_model/tokenizer_model
  tokenizer_prefix: byte_bpe
  vocabulary_size: 3200
  eos_token: "<|eos|>"
  min_frequency: 2
  shard_tokens: 100000000

model:
  max_sequence_length: 1200
  hidden_size: 384
  heads: 4
  blocks: 6
  dropout: 0.1

training:
  optimizer: AdamW
  epoch: 1
  batch_size: 4
  steps: 2000
  learning_rate: 0.0003
  maximum_gradient_norm: 1.0
  log_every: 50
  seed: 7

checkpoint:
  path: language_model/checkpoints/transformer.safetensors
