tools:
  - class_name: model.language_model.scripts.verl_workspace_tool.WorkspaceTool
    config:
      type: native
      operation: exec_command
      max_timeout: 60
      max_output: 12000
    tool_schema:
      type: function
      function:
        name: exec_command
        description: Run a shell command inside the episode workspace.
        parameters:
          type: object
          properties:
            cmd:
              type: string
              description: Codex-compatible shell command.
            workdir:
              type: string
              description: Working directory inside the episode workspace; relative paths and the virtual /workspace root are accepted (Codex name).
            yield_time_ms:
              type: integer
              description: Codex-compatible wait hint; bounded workspace execution waits for completion.
            max_output_tokens:
              type: integer
              description: Codex-compatible output hint; the workspace tool applies its own output cap.
            tty:
              type: boolean
              description: Codex-compatible terminal hint; workspace execution remains bounded by the adapter.
            shell:
              type: string
              description: Shell executable requested by the Codex call.
            login:
              type: boolean
              description: Whether the requested shell should use login mode.
            justification:
              type: string
              description: Codex permission-audit justification; it does not grant extra workspace access.
            prefix_rule:
              type: array
              items:
                type: string
              description: Codex permission-audit prefix rule; it does not grant extra workspace access.
            sandbox_permissions:
              type: string
              enum: [use_default, require_escalated]
              description: Codex permission request. require_escalated is rejected by workspace_host.
          required: [cmd]
          additionalProperties: false
  - class_name: model.language_model.scripts.verl_workspace_tool.WorkspaceTool
    config:
      type: native
      operation: apply_patch
      max_timeout: 60
      max_output: 12000
    tool_schema:
      type: function
      function:
        name: apply_patch
        description: Apply a Codex patch string or an object containing patch inside the episode workspace.
        parameters:
          type: object
          properties:
            patch:
              type: string
              description: A standard unified diff.
          required: [patch]
