tools:
  - class_name: model.language_model.scripts.verl_workspace_tool.WorkspaceTool
    config:
      type: native
      operation: exec_command
      max_timeout: 60
      max_output: 12000
    tool_schema:
      type: function
      function:
        name: exec_command
        description: Run a shell command inside the episode workspace.
        parameters:
          type: object
          properties:
            command:
              type: string
              description: The command to run.
            cwd:
              type: string
              description: Relative working directory inside the workspace.
            timeout:
              type: integer
              description: Maximum command duration in seconds.
          required: [command]
  - class_name: model.language_model.scripts.verl_workspace_tool.WorkspaceTool
    config:
      type: native
      operation: apply_patch
      max_timeout: 60
      max_output: 12000
    tool_schema:
      type: function
      function:
        name: apply_patch
        description: Apply a standard unified diff inside the episode workspace.
        parameters:
          type: object
          properties:
            patch:
              type: string
              description: A standard unified diff.
          required: [patch]
