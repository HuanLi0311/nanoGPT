data:
  encoded_dir: model/language_model/data/encode/sft_toolcalls

training:
  batch_size: 4
  steps: 1000
  learning_rate: 0.00005
  optimizer: adamw
  weight_decay: 0.01
  maximum_gradient_norm: 1.0
  log_every: 50
  seed: 7

checkpoint:
  pretrained_path: model/language_model/checkpoints/transformer_sft_aligned_1000_5gpu.safetensors
  path: model/language_model/checkpoints/transformer_sft_toolcalls_1000_5gpu.safetensors
