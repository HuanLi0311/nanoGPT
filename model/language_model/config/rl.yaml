
data:
  path: model/language_model/data/post_train/verl/train.jsonl
  tokenizer_dir: model/language_model/data/encode/pretrain
  tokenizer_prefix: byte_bpe
  system_prompt: You are a careful coding agent. Return a concise final answer or a JSON tool call.

training:
  group_size: 4
  steps: 1000
  epochs: 1
  learning_rate: 0.00001
  optimizer: adamw
  weight_decay: 0.01
  maximum_gradient_norm: 1.0
  clip_range: 0.2
  kl_coefficient: 0.01
  max_new_tokens: 256
  temperature: 0.7
  log_every: 10
  seed: 7

checkpoint:
  sft_path: model/language_model/checkpoints/transformer_sft.safetensors
  path: model/language_model/checkpoints/transformer_grpo.safetensors
