# verl contract for the agent dataset. The default is the Qwen3 SFT output;
# replace MODEL_PATH only with another transformers/vLLM-compatible student.
algorithm:
  adv_estimator: grpo
data:
  train_files: [model/language_model/data/post_train/verl/train.parquet]
  val_files: [model/language_model/data/post_train/verl/val.parquet]
  return_raw_chat: true
  need_tools_kwargs: true
  tool_config_path: model/language_model/config/verl_tools.yaml
  train_batch_size: 4
  max_prompt_length: 1200
  max_response_length: 256
  filter_overlong_prompts: true
  truncation: error
actor_rollout_ref:
  model:
    path: ${oc.env:MODEL_PATH,model/language_model/checkpoints/qwen/Qwen3-8B-Base-sft-verl}
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    agent:
      default_agent_loop: tool_agent
    multi_turn:
      enable: true
      tool_config_path: model/language_model/config/verl_tools.yaml
      format: hermes
  actor:
    ppo_mini_batch_size: 16
    ppo_epochs: 1
reward:
  custom_reward_function:
    path: model/language_model/scripts/verl_reward.py
    name: compute_score
  reward_manager:
    source: importlib
    name: RetryOnIneligibleRewardManager
    module:
      path: model/language_model/scripts/verl_reward_manager.py
trainer:
  project_name: nanoagent
  experiment_name: grpo_codex
  n_gpus_per_node: 8
  nnodes: 1
  v1:
    sampler:
      sync_refill_failed_groups: true
