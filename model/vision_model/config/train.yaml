data:
  train_dir: model/vision_model/data/imagenette_100/train
  validation_dir: model/vision_model/data/imagenette_100/val

model:
  image_size: 160
  patch_size: 16
  channels: 3
  hidden_size: 192
  heads: 3
  blocks: 4
  mlp_ratio: 4.0
  dropout: 0.1

training:
  batch_size: 128
  epochs: 1
  learning_rate: 0.0003
  weight_decay: 0.05
  num_workers: 4
  device: auto
  seed: 7

checkpoint:
  path: model/vision_model/checkpoints/vit_imagenette.pt
